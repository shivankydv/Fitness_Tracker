<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('profile')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('profile')}"></div>
    <div class="content" style="max-width:680px">
      <div th:replace="~{fragments/layout :: flash}"></div>
      <div class="card">
        <h2 style="margin:0">Edit Profile</h2>
        <p class="sub">Update your account information. Binds to <code>profileRequest</code> (fixed).</p>
        <form th:action="@{/profile}" method="post" th:object="${profileRequest}" class="form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div>
            <label class="label" for="name">FULL LEGAL / DISPLAY NAME</label>
            <input class="input" type="text" id="name" name="name" th:value="*{name}" maxlength="100" required/>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
          </div>
          <div>
            <label class="label" for="email">TELEMETRY EMAIL</label>
            <input class="input" type="email" id="email" name="email" th:value="*{email}" maxlength="255" required/>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
          </div>
          <div style="display:flex;gap:10px">
            <a th:href="@{/profile}" class="btn btn-ghost" style="flex:1">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex:2">Save Profile Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
