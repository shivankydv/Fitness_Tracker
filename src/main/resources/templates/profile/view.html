<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Profile</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-4 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-12 col-lg-7">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">My Profile</h2>
                        <p class="text-secondary small">Account details</p>
                    </div>
                    
                    <!-- Flash message -->
                    <div th:if="${flash}" class="alert alert-"
                         th:classappend="${flashType}">
                        <span th:text="${flash}">Profile updated successfully!</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <div class="mb-3">
                        <h4 class="fw-bold mb-3">Account Information</h4>
                        
                        <div class="row mb-3">
                            <div class="col-4 text-secondary small">Member since</div>
                            <div class="col-8"><span th:text="#{profile.memberSince}(date)=${user.createdAt ?: '-'}">2024-01-15</span></div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-4 text-secondary small">Username</div>
                            <div class="col-8"><span th:text="${user.name}">Username</span></div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-4 text-secondary small">Email</div>
                            <div class="col-8"><a href="mailto:#{profile.email}" th:text="${user.email}">email@example.com</a></div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-4 text-secondary small">Member ID</div>
                            <div class="col-8"><strong th:text="${user.id}">12345</strong></div>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <a href="/profile/edit"
                           class="btn btn-primary fw-bold rounded-pill py-2 px-4">
                            <i class="fas fa-edit me-2"></i> Edit Profile
                        </a>
                        <a href="/settings"
                           class="btn btn-outline-secondary fw-bold rounded-pill py-2 px-4 mt-2">
                            <i class="fas fa-cog me-2"></i> Settings
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
