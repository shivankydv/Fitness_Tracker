<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Login</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-5 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-md-7 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">Fitness Tracker</h2>
                        <p class="text-secondary">Track your workouts, activities, and goals</p>
                    </div>
                    
                    <hr class="my-4">
                    
                    <!-- Error message -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
                        <strong th:text="${error}">Invalid email or password</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <!-- Logout message -->
    <div th:if="${message}" class="alert alert-info alert-dismissible fade show mb-3">
        <strong th:text="${message}">You have been successfully logged out.</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
                    
                    <form th:action="@{/auth/login}" method="POST" class="mt-4">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Email address</label>
                            <input type="email" id="email" name="email"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your email"
                                   required autocomplete="email">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" id="password" name="password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your password"
                                   required>
                        </div>
                        
                        <button type="submit"
                                class="btn btn-primary w-100 py-3 fw-bold rounded-3">
                            Sign In
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <small class="text-body-secondary">Don't have an account? 
                            <a href="/auth/register" class="fw-bold text-primary">Create an account</a>
                        </small>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
