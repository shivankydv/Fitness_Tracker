<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${activity != null and activity.id != null} ? 'Edit Activity' : 'Log Activity')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('activities')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('activities')}"></div>
    <div class="content" style="max-width:760px">
      <div th:replace="~{fragments/layout :: flash}"></div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0" th:text="${activity != null and activity.id != null} ? 'Edit Activity' : 'Log New Activity'">Log New Activity</h2>
          <a th:href="@{/activities}" class="btn btn-ghost btn-sm">✕</a>
        </div>
        <p class="sub">All fields map 1:1 to the backend ActivityRequest.</p>
        <!-- Preserves th:object + POST target logic; inputs use name= for binding -->
        <form th:action="${activity != null and activity.id != null} ? @{/activities/{id}(id=${activity.id})} : @{/activities}" method="post" th:object="${activityRequest}" class="form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div>
            <label class="label" for="activityType">ACTIVITY TYPE</label>
            <select class="input" id="activityType" name="activityType" required>
              <option value="">Select activity type</option>
              <option th:each="type : ${activityTypes}" th:value="${type}" th:text="${type}" th:selected="${activityRequest != null and activityRequest.activityType == type}">RUNNING</option>
            </select>
          </div>
          <div>
            <label class="label" for="activityDate">DATE</label>
            <input class="input" type="date" id="activityDate" name="activityDate" th:value="${activityRequest != null and activityRequest.activityDate != null ? #temporals.format(activityRequest.activityDate, 'yyyy-MM-dd') : (activity != null and activity.activityDate != null ? #temporals.format(activity.activityDate, 'yyyy-MM-dd') : '')}" required/>
          </div>
          <div class="row2">
            <div>
              <label class="label" for="durationMinutes">DURATION (MINUTES, 0–1440)</label>
              <input class="input" type="number" id="durationMinutes" name="durationMinutes" min="0" max="1440" th:value="${activityRequest?.durationMinutes}" required/>
            </div>
            <div>
              <label class="label" for="distanceKm">DISTANCE (KM)</label>
              <input class="input" type="number" step="0.01" id="distanceKm" name="distanceKm" min="0" th:value="${activityRequest?.distanceKm}" required/>
            </div>
          </div>
          <div>
            <label class="label" for="caloriesBurned">ENERGY BURNED (0–10000 KCAL)</label>
            <input class="input" type="number" id="caloriesBurned" name="caloriesBurned" min="0" max="10000" th:value="${activityRequest?.caloriesBurned}" required/>
          </div>
          <div>
            <label class="label" for="notes">SESSION NOTES (≤1000 CHARS, VISUAL-ONLY RPE/TAGS OMITTED)</label>
            <textarea class="input" id="notes" name="notes" rows="3" maxlength="1000" th:text="${activityRequest?.notes}"></textarea>
          </div>
          <div style="display:flex;gap:10px">
            <a th:href="@{/activities}" class="btn btn-ghost" style="flex:1">CANCEL</a>
            <button type="submit" class="btn btn-primary" style="flex:2" th:text="${activity != null and activity.id != null} ? 'UPDATE ACTIVITY' : 'SAVE WORKOUT'">SAVE WORKOUT</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
