<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Activity Details</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-4 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-12 col-lg-8">
            
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb-custom">
                    <li class="breadcrumb-item"><a href="/dashboard"><i class="fas fa-home"></i> Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Activity Details</li>
                </ol>
            </nav>
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-3">
                        <span class="activity-type-badge"
                              th:class="'badge bg-'
                                      + ${activity.activityType} == 'RUNNING' ? 'primary'
                                      : ${activity.activityType} == 'WALKING' ? 'secondary'
                                      : ${activity.activityType} == 'CYCLING' ? 'success'
                                      : ${activity.activityType} == 'SWIMMING' ? 'info'
                                      : ${activity.activityType} == 'STRENGTH' ? 'warning'
                                      : 'secondary'">
                            <i class="fas fa-fw"
                               th:class="'fas fa-'
                                       + ${activity.activityType} == 'RUNNING' ? 'running'
                                       : ${activity.activityType} == 'WALKING' ? 'walking'
                                       : ${activity.activityType} == 'CYCLING' ? 'cycling'
                                       : ${activity.activityType} == 'SWIMMING' ? 'swimming'
                                       : ${activity.activityType} == 'STRENGTH' ? 'dumbbell'
                                       : 'runner'">
                            </i>
                            <span th:text="${activity.activityType}">RUNNING</span>
                        </span>
                    </div>
                    
                    <h2 class="fw-bold mb-3">Activity Details</h2>
                    
                    <div class="row mb-4">
                        <div class="col-6 mb-3">
                            <p class="text-secondary small">Date</p>
                            <p class="fw-bold" th:text="#{activity.date}">2024-01-15</p>
                        </div>
                        <div class="col-6 mb-3">
                            <p class="text-secondary small">Duration</p>
                            <p class="fw-bold" th:text="${activity.durationMinutes}+' min'">30 min</p>
                        </div>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-6 mb-3">
                            <p class="text-secondary small">Distance</p>
                            <p class="fw-bold" th:text="${activity.distanceKm}+' km'">5.00 km</p>
                        </div>
                        <div class="col-6 mb-3">
                            <p class="text-secondary small">Calories Burned</p>
                            <p class="fw-bold" th:text="${activity.caloriesBurned}+' kcal'">300 kcal</p>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <p class="text-secondary small">Notes</p>
                        <p th:text="${activity.notes ? '${activity.notes}' : 'No notes'}" class="fw-medium"></p>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <a th:href="@{/activities/{id}(id=${activity.id})}"
                           class="btn btn-outline-primary rounded-pill py-2 px-3">
                            <i class="fas fa-edit me-1"></i> Edit
                        </a>
                        
                        <form th:action="@{/activities/{id}/delete(id=${activity.id})}" method="POST"
                              class="d-inline">
                            <button type="submit"
                                    class="btn btn-danger rounded-pill py-2 px-3"
                                    onclick="return confirm('Delete this activity? This action cannot be undone.)'>
                                <i class="fas fa-trash me-1"></i> Delete
                            </button>
                        </form>
                    </div>
                    
                    <a th:href="@{/activities}" class="btn btn-outline-secondary rounded-pill py-2 px-3">
                        <i class="fas fa-arrow-left me-1"></i> Back to Activities
                    </a>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>

</body>
</html>
