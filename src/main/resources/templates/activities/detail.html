<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Activity Details')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('activities')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('activities')}"></div>
    <div class="content" style="max-width:820px">
      <div class="muted"><a th:href="@{/dashboard}">Home</a> / <a th:href="@{/activities}">Activities</a> / Details</div>
      <div class="card">
        <span class="badge run" th:text="${activity.activityType}">RUNNING</span>
        <h1 class="serif" style="font-size:34px;margin:10px 0">Activity Details</h1>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div><div class="kicker">DATE</div><strong th:text="${#temporals.format(activity.activityDate, 'yyyy-MM-dd')}">2024-01-15</strong></div>
          <div><div class="kicker">DURATION</div><strong th:text="${activity.durationMinutes} + ' min'">30 min</strong></div>
          <div><div class="kicker">DISTANCE</div><strong th:text="${activity.distanceKm} + ' km'">5.00 km</strong></div>
          <div><div class="kicker">CALORIES BURNED</div><strong th:text="${activity.caloriesBurned} + ' kcal'">300 kcal</strong></div>
        </div>
        <div style="margin-top:14px"><div class="kicker">NOTES</div><p th:text="${activity.notes != null and !#strings.isEmpty(activity.notes) ? activity.notes : 'No notes'}">No notes</p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          <a th:href="@{/activities/{id}/edit(id=${activity.id})}" class="btn btn-primary btn-sm">Edit</a>
          <form th:action="@{/activities/{id}/delete(id=${activity.id})}" method="post" style="display:inline;margin:0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this activity? This action cannot be undone.')">Delete</button>
          </form>
          <a th:href="@{/activities}" class="btn btn-ghost btn-sm">← Back to Activities</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
