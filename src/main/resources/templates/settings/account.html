<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete Account')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('settings')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div class="content" style="max-width:640px">
      <div class="card" style="border-color:#f0c9c4">
        <h2 style="color:var(--danger);margin:0">Destructive Zone</h2>
        <p class="sub">Permanently remove your athlete profile, synchronized workouts, and historical telemetry. This action cannot be undone.</p>
        <div class="alert danger"><strong>Warning:</strong> All activities, goals, and account data will be permanently deleted.</div>
        <form th:action="@{/settings/account/delete}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger" style="width:100%" onclick="return confirm('Are you sure you want to delete your account?')">Delete Account &amp; Biometrics…</button>
        </form>
        <div style="height:10px"></div>
        <a th:href="@{/settings}" class="btn btn-ghost" style="width:100%">← Back to Settings</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
