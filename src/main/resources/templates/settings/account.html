<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Delete Account</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght:300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-5 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-md-7 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2 text-danger">Delete Account</h2>
                        <p class="text-secondary">This action cannot be undone.</p>
                    </div>
                    
                    <div class="alert alert-warning">
                        <strong>Warning:</strong> All your activities, goals, and account data will be permanently deleted.
                    </div>
                    
                    <form th:action="@{/settings/account/delete}" method="POST">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        
                        <button type="submit"
                                class="btn btn-danger w-100 py-3 fw-bold rounded-3"
                                onclick="return confirm('Are you sure you want to delete your account?')">
                            Delete My Account
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="/settings" class="btn btn-outline-secondary fw-bold rounded-pill py-2 px-4">
                            <i class="fas fa-arrow-left me-2"></i> Back to Settings
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
