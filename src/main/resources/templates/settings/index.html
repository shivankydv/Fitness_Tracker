<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Settings</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-5 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-md-7 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">Settings</h2>
                        <p class="text-secondary">Manage your account</p>
                    </div>
                    
                    <!-- Flash message -->
                    <div th:if="${flash}" class="alert alert-"
                         th:classappend="${flashType}">
                        <span th:text="${flash}">Settings updated!</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <nav aria-label="settings-menu">
                        <div class="list-group mb-4">
                            <a href="/profile" class="list-group-item list-group-item-action rounded-pill">
                                <i class="fas fa-user me-2"></i> Profile
                            </a>
                            <a href="/settings/security" class="list-group-item list-group-item-action rounded-pill">
                                <i class="fas fa-shield-halved me-2"></i> Security
                            </a>
                            <a href="/settings/account" class="list-group-item list-group-item-action rounded-pill text-danger">
                                <i class="fas fa-trash me-2"></i> Delete Account
                            </a>
                        </div>
                    </nav>
                    
                    <div class="text-center">
                        <a href="/dashboard" class="btn btn-outline-secondary fw-bold rounded-pill py-2 px-4">
                            <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
