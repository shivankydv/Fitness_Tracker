<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-5 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-md-7 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">Welcome Back!</h2>
                        <p class="text-secondary">You are successfully authenticated.</p>
                    </div>
                    
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <div class="fw-medium" th:text="'Welcome, ' + ${username}">Welcome, User</div>
                    </div>
                    
                    <p class="text-body-secondary small">Your Fitness Tracker account is active and ready to use.</p>
                    
                    <div class="mt-4">
                        <a href="/activities" class="btn btn-outline-primary me-2">View Activities</a>
                        <a href="/goals" class="btn btn-outline-secondary">View Goals</a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
