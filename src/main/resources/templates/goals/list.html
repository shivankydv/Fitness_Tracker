<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Goals')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('goals')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('goals')}"></div>
    <div class="content">
      <div class="eyebrow">TARGET ACQUISITION • TELEMETRY</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div><h1 style="font-size:40px;margin:0">Goals</h1><p class="sub">Give your progress a direction.</p></div>
        <a class="btn btn-primary" th:href="@{/goals/new}">+ CREATE GOAL</a>
      </div>
      <div th:replace="~{fragments/layout :: flash}"></div>
      <div class="tabs" role="navigation" aria-label="Goal status filter">
        <a th:href="@{/goals}" th:classappend="${currentStatus == null} ? ' on' : ''">All Goals</a>
        <a th:href="@{/goals(status='ACTIVE')}" th:classappend="${currentStatus != null and currentStatus.name() == 'ACTIVE'} ? ' on' : ''">Active</a>
        <a th:href="@{/goals(status='COMPLETED')}" th:classappend="${currentStatus != null and currentStatus.name() == 'COMPLETED'} ? ' on' : ''">Completed</a>
        <a th:href="@{/goals(status='PAUSED')}" th:classappend="${currentStatus != null and currentStatus.name() == 'PAUSED'} ? ' on' : ''">Paused</a>
        <a th:href="@{/goals(status='CANCELLED')}" th:classappend="${currentStatus != null and currentStatus.name() == 'CANCELLED'} ? ' on' : ''">Archived</a>
      </div>

      <div th:if="${#lists.isEmpty(goals)}" class="empty">
        <h3>No goals yet.</h3>
        <p class="muted">Set your first fitness goal to get started.</p>
        <a th:href="@{/goals/new}" class="btn btn-primary">+ Create Your First Goal</a>
      </div>

      <div th:unless="${#lists.isEmpty(goals)}" class="grid g2e">
        <div class="card" th:each="goal : ${goals}">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <span class="kicker" th:text="${goal.goalType} + ' • TARGET'">DISTANCE</span>
            <span class="pill green" th:text="${goal.status}">ACTIVE</span>
          </div>
          <h3 style="font-size:22px;margin:10px 0" th:text="${goal.title}">Run 50 km Monthly</h3>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="stat-num" style="font-size:34px"><span th:text="${goal.currentValue}">0</span><span class="stat-unit"> / <span th:text="${goal.targetValue}">100</span> <span th:text="${goal.unit}">km</span></span></div>
            <strong th:text="${goal.getProgressPercentage()} + '%'">0%</strong>
          </div>
          <div class="bar"><span th:style="'width:' + ${goal.getProgressPercentage()} + '%'"></span></div>
          <div class="muted" style="margin-top:8px">Deadline: <span th:text="${goal.deadline != null ? #temporals.format(goal.deadline, 'yyyy-MM-dd') : '-'}">-</span></div>
          <div class="actions" style="margin-top:12px">
            <a class="btn btn-ghost btn-sm" th:href="@{/goals/{id}(id=${goal.id})}">Details</a>
            <a class="btn btn-ghost btn-sm" th:href="@{/goals/{id}/edit(id=${goal.id})}">Update</a>
            <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="post" style="display:inline;margin:0">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-ghost btn-sm" onclick="return confirm('Delete this goal? This action cannot be undone.')">Delete</button>
            </form>
          </div>
        </div>
      </div>

      <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}" th:href="@{/goals(page=${currentPage - 1}, status=${currentStatus})}">‹</a>
        <th:block th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
          <a th:if="${pageNum != currentPage}" th:href="@{/goals(page=${pageNum}, status=${currentStatus})}" th:text="${pageNum + 1}">1</a>
          <span th:if="${pageNum == currentPage}" class="cur" th:text="${pageNum + 1}">1</span>
        </th:block>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/goals(page=${currentPage + 1}, status=${currentStatus})}">›</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
