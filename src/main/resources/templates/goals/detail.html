<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Goal Details')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('goals')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('goals')}"></div>
    <div class="content" style="max-width:820px">
      <div class="muted"><a th:href="@{/dashboard}">Home</a> / <a th:href="@{/goals}">Goals</a> / Details</div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="badge" th:text="${goal.goalType}">DISTANCE</span>
          <span class="pill green" th:text="${goal.status}">ACTIVE</span>
        </div>
        <h1 style="font-size:32px;margin:10px 0" th:text="${goal.title}">Goal title</h1>
        <div class="stat-num"><span th:text="${goal.currentValue}">0</span><span class="stat-unit"> / <span th:text="${goal.targetValue}">100</span> <span th:text="${goal.unit}">km</span></span></div>
        <div class="bar"><span th:style="'width:' + ${goal.getProgressPercentage()} + '%'"></span></div>
        <div class="muted" style="margin-top:8px"><span th:text="${goal.getProgressPercentage()} + '%'">0%</span> • Deadline: <span th:text="${goal.deadline != null ? #temporals.format(goal.deadline, 'yyyy-MM-dd') : '-'}">-</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          <a th:href="@{/goals/{id}/edit(id=${goal.id})}" class="btn btn-primary btn-sm">Edit</a>
          <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="post" style="display:inline;margin:0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this goal? This action cannot be undone.')">Delete</button>
          </form>
          <a th:href="@{/goals}" class="btn btn-ghost btn-sm">← Back to Goals</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
