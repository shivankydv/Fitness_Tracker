<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Security</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght:300;400;500;600;700&display=swap">
</head>
<body style="font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; margin: 0; padding: 0;">

<div class="container py-5 px-4 max-width-clear">
    
    <div class="row justify-content-center w-100">
        <div class="col-md-7 col-lg-5 col-xl-4">
            
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff; margin: 0 auto;">
                <div class="card-body p-5 p-lg-6">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">Security Settings</h2>
                        <p class="text-secondary">Change your password</p>
                    </div>
                    
                    <!-- Flash message -->
                    <div th:if="${flash}" class="alert alert-"
                         th:classappend="${flashType}">
                        <span th:text="${flash}">Password changed successfully!</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <!-- Error message -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3">
                        <strong th:text="${error}">Error</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <form th:action="@{/settings/security/password}" method="POST">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-medium">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your current password"
                                   required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-medium">New Password</label>
                            <input type="password" id="newPassword" name="newPassword"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your new password"
                                   required minlength="8">
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-medium">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="form-control form-control-lg"
                                   placeholder="Confirm your new password"
                                   required>
                        </div>
                        
                        <button type="submit"
                                class="btn btn-primary w-100 py-3 fw-bold rounded-3">
                            Update Password
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="/settings" class="btn btn-outline-secondary fw-bold rounded-pill py-2 px-4">
                            <i class="fas fa-arrow-left me-2"></i> Back to Settings
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
