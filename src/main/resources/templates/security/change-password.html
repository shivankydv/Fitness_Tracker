<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Security')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: sidebar('settings')}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Athlete')}"></div>
    <div th:replace="~{fragments/layout :: mobilenav('settings')}"></div>
    <div class="content" style="max-width:680px">
      <h1 style="font-size:32px;margin:0">Security &amp; Password Credentials</h1>
      <p class="sub">Fields use backend <code>currentPassword / newPassword / confirmPassword</code> request params.</p>
      <div th:replace="~{fragments/layout :: flash}"></div>
      <div class="card">
        <form th:action="@{/settings/security/password}" method="post" class="form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div>
            <label class="label" for="currentPassword">CURRENT PASSWORD</label>
            <input class="input" type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password" required/>
          </div>
          <div class="row2">
            <div>
              <label class="label" for="newPassword">NEW PASSWORD (≥8)</label>
              <input class="input" type="password" id="newPassword" name="newPassword" placeholder="Min. 12 characters" required minlength="8"/>
            </div>
            <div>
              <label class="label" for="confirmPassword">CONFIRM NEW PASSWORD</label>
              <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Update Password</button>
        </form>
        <div style="height:10px"></div>
        <a th:href="@{/settings}" class="btn btn-ghost" style="width:100%">← Back to Settings</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
